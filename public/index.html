<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="tabterm">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<!-- iPhone PWA splash screens (5 device sizes — mobile shell Phase 2). assets are
     auto-generated by scripts/gen-splash.mjs. media queries follow Apple's required
     pixel + DPR pairings; mismatched displays fall back to system black. iOS does
     not match these in landscape standalone launch; landscape users see system
     black, which already matches the mostly-black splash visually. Adding
     orientation: landscape variants would double the asset count for negligible
     gain (tabterm PWA is portrait-primary). -->
<link rel="apple-touch-startup-image" href="/splash/iphone-se-2g-1334x750.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)">
<link rel="apple-touch-startup-image" href="/splash/iphone-11-1792x828.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)">
<link rel="apple-touch-startup-image" href="/splash/iphone-x-2436x1125.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="/splash/iphone-13-2532x1170.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
<link rel="apple-touch-startup-image" href="/splash/iphone-13-pro-max-2778x1284.png"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/styles.css">
<title>tabterm</title>
</head>
<body>
<!-- auth screen -->
<div id="auth" class="auth hidden">
  <form id="auth-form">
    <div class="auth-brand">tabterm</div>
    <p id="auth-mode" class="auth-mode">login</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="password" required minlength="12">
    <input id="pw2" class="hidden" type="password" autocomplete="new-password" placeholder="confirm" minlength="12">
    <button type="submit">Enter</button>
    <p id="auth-msg" class="auth-msg"></p>
  </form>
</div>

<!-- main app -->
<div id="app" class="app hidden">
  <!-- window chrome -->
  <div class="winchrome">
    <div class="wc-tools">
      <div class="btn" id="btn-sidebar" title="Toggle sidebar">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M6 3 V13"/></svg>
      </div>
      <div class="btn" id="btn-hydra-recheck" title="Re-check HydraTeams">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8 a5 5 0 1 1-1.5-3.5"/><path d="M13 3 V5.5 H10.5"/></svg>
      </div>
      <div class="btn" id="btn-sidebar-right" title="Toggle DevPlatform info panel">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M10 3 V13"/></svg>
      </div>
    </div>
      <div class="wc-spacer"></div>
      <div class="wc-title">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-2)"><path d="M2 5 a1 1 0 0 1 1-1 h3.5 l1.5 1.5 H13 a1 1 0 0 1 1 1 V12 a1 1 0 0 1-1 1 H3 a1 1 0 0 1-1-1 Z"/></svg>
        <span id="wc-title-text">tabterm</span>
        <!-- WS reconnect indicator: hidden when online; tooltip via title -->
        <span id="ws-status" class="ws-status" data-state="online" title="WebSocket online" aria-live="polite"></span>
      </div>
    </div>

  <div class="shell">
    <!-- mobile-only: dim backdrop behind drawer sidebar; tap to close -->
    <div id="sidebar-backdrop" class="sidebar-backdrop hidden" aria-hidden="true"></div>

    <!-- sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-tabs" id="sidebar-tabs" role="tablist">
        <button type="button" class="sidebar-tab active" data-tab="sessions" role="tab" aria-selected="true">Sessions</button>
        <button type="button" class="sidebar-tab" data-tab="explorer" role="tab" aria-selected="false">Explorer</button>
      </div>
      <div class="sidebar-pane" id="sidebar-pane-sessions">
        <div class="sidebar-list" id="sidebar-list"></div>
      </div>
      <div class="sidebar-pane hidden" id="sidebar-pane-explorer">
        <div class="explorer-toolbar">
          <input type="text" id="explorer-path-input" class="explorer-path-input" spellcheck="false" autocomplete="off" placeholder="C:/path/to/dir + Enter">
          <button type="button" class="explorer-up" id="explorer-up" title="Up one level">↑</button>
        </div>
        <div class="explorer-tree" id="explorer-tree" aria-label="Filesystem tree"></div>
      </div>
      <div class="sidebar-foot" id="sidebar-foot-sessions">
        <div class="ws-add" id="btn-new-claude" title="Create new Claude session (HydraTeams proxy)">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5 V12.5 M3.5 8 H12.5"/></svg>
          <span>+ Claude</span>
        </div>
        <div class="ws-add ws-add-opencode" id="btn-new-opencode" title="Create new OpenCode session (Nopersb proxy)">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5 V12.5 M3.5 8 H12.5"/></svg>
          <span>+ OpenCode</span>
        </div>
      </div>
    </aside>

    <!-- main column -->
    <main class="main">
      <!-- minimal toolbar (no traffic-lights, no duplicate tabs) -->
      <div class="toolbar">
        <div class="slot-strip" id="slot-strip">
          <div class="slot-chip" id="slot-chip-0" data-slot="0"><span class="slot-num">L</span><span class="slot-label">empty</span></div>
          <div class="slot-chip" id="slot-chip-1" data-slot="1"><span class="slot-num">R</span><span class="slot-label">empty</span></div>
        </div>
        <div class="actions">
          <div class="btn sys" id="btn-boot-all" title="Boot all workers (0..N)">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5 V8 M5 4.5 L8 1.5 L11 4.5"/><path d="M2.5 8 V12.5 H13.5 V8"/></svg>
          </div>
          <div class="btn sys" id="btn-cleanup-zombies" title="Cleanup zombie processes (bun/claude/node)">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5 H12 L11 13 a1 1 0 0 1-1 1 H6 a1 1 0 0 1-1-1 Z"/><path d="M3 5.5 H13 M6.5 4 V3 a1 1 0 0 1 1-1 H8.5 a1 1 0 0 1 1 1 V4"/></svg>
          </div>
          <div class="btn sys" id="btn-wd-status" title="Watchdog status">
            <span class="wd-dot" id="wd-dot" data-state="unknown"></span>
          </div>
          <span class="actions-divider"></span>
          <div class="btn" id="btn-soft-stop" title="Send Ctrl+C">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor" stroke="none"><rect x="5" y="3.5" width="2" height="9"/><rect x="9" y="3.5" width="2" height="9"/></svg>
          </div>
          <div class="btn danger" id="btn-kill" title="Force kill active session">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 3.5 L12.5 12.5 M12.5 3.5 L3.5 12.5"/></svg>
          </div>
          <div class="btn" id="btn-logout" title="Logout">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4 V3 a1 1 0 0 0-1-1 H3 a1 1 0 0 0-1 1 V13 a1 1 0 0 0 1 1 H9 a1 1 0 0 0 1-1 V12"/><path d="M6.5 8 H14 M11.5 5 L14 8 L11.5 11"/></svg>
          </div>
        </div>
      </div>

      <!-- workspace (max 2 split panes) -->
      <div class="workspace" id="workspace"></div>

      <!-- watchdog status modal (toggled by btn-wd-status) -->
      <div id="wd-modal" class="wd-modal hidden" role="dialog" aria-modal="true" aria-labelledby="wd-modal-title">
        <div class="wd-modal-card">
          <div class="wd-modal-head">
            <span id="wd-modal-title">Watchdog status</span>
            <span class="wd-modal-close" id="btn-wd-modal-close" title="Close">
              <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 3.5 L12.5 12.5 M12.5 3.5 L3.5 12.5"/></svg>
            </span>
          </div>
          <div class="wd-modal-body">
            <div class="wd-summary" id="wd-summary"></div>
            <div class="wd-log" id="wd-log"></div>
          </div>
        </div>
      </div>

      <!-- file explorer modal (Phase 1: read-only viewer) -->
      <div id="fx-modal" class="fx-modal hidden" role="dialog" aria-modal="true" aria-labelledby="fx-title" hidden>
        <div class="fx-card">
          <div class="fx-head">
            <span id="fx-title">Files</span>
            <span id="fx-path" class="fx-path" title=""></span>
            <span class="fx-close" id="fx-close" title="Close (Esc)">
              <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 3.5 L12.5 12.5 M12.5 3.5 L3.5 12.5"/></svg>
            </span>
          </div>
          <div class="fx-body">
            <div class="fx-tree" id="fx-tree" aria-label="File tree"></div>
            <div class="fx-detail" id="fx-detail" aria-label="File detail"></div>
          </div>
        </div>
      </div>

      <!-- toast -->
      <div id="toast" class="toast hidden">
        <span class="pulse" id="toast-pulse"></span>
        <span id="toast-text">tabterm ready</span>
        <span class="toast-btn" id="toast-dismiss" title="Dismiss">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 3.5 L12.5 12.5 M12.5 3.5 L3.5 12.5"/></svg>
        </span>
      </div>
    </main>

    <!-- right sidebar: mirrors opencode TUI's right info panel (Context / MCP / LSP / CWD)
         via the opencode HTTP API. Hidden by default; toggle via #btn-sidebar-right.
         Only populates for sessions with engine='opencode' (apiPort meta set by server). -->
    <aside class="sidebar sidebar-right collapsed" id="sidebar-right" aria-label="OpenCode info">
      <div class="sidebar-right-head">
        <span class="sidebar-right-title">OpenCode</span>
        <span class="sidebar-right-state" id="dp-state" data-state="idle">idle</span>
      </div>
      <div class="dp-section">
        <div class="dp-section-title">Context</div>
        <div class="dp-section-body" id="dp-context">—</div>
      </div>
      <div class="dp-section">
        <div class="dp-section-title">MCP</div>
        <div class="dp-section-body" id="dp-mcp">—</div>
      </div>
      <div class="dp-section">
        <div class="dp-section-title">LSP</div>
        <div class="dp-section-body" id="dp-lsp">—</div>
      </div>
      <div class="dp-section">
        <div class="dp-section-title">CWD</div>
        <div class="dp-section-body" id="dp-cwd">—</div>
      </div>
    </aside>
  </div>

  <!-- iPad / iOS hangul IME input rail (hidden by default; revealed by body.ios-ime) -->
  <div id="ime-bar" class="ime-bar" role="region" aria-label="iOS input rail">
    <div class="ime-keys">
      <button type="button" class="ime-key" data-key="esc" title="Esc">Esc</button>
      <button type="button" class="ime-key" data-key="tab" title="Tab">Tab</button>
      <button type="button" class="ime-key" data-key="ctrl-c" title="Ctrl+C">^C</button>
      <button type="button" class="ime-key" data-key="bs" title="Backspace">⌫</button>
      <button type="button" class="ime-key" data-key="up" title="↑">↑</button>
      <button type="button" class="ime-key" data-key="down" title="↓">↓</button>
      <button type="button" class="ime-key" data-key="left" title="←">←</button>
      <button type="button" class="ime-key" data-key="right" title="→">→</button>
    </div>
    <div class="ime-row">
      <textarea id="ime-input" rows="1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="한글 입력 후 Enter (Shift+Enter=줄바꿈)"></textarea>
      <button type="button" id="ime-send" class="ime-send" title="Send (Enter)">↵</button>
    </div>
  </div>

  <div id="kbd-spacer" class="kbd-spacer"></div>

  <!-- mobile-only: 5-tab fixed bottom nav (replaces desktop toolbar on phones).
       Sidebar / slot L / slot R / Cmds / More. Buttons hide on desktop via CSS. -->
  <nav id="bottom-nav" class="bottom-nav" aria-label="mobile navigation" hidden>
    <button type="button" class="bn-btn" data-act="sidebar" aria-label="Sidebar">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3" width="11" height="10" rx="1.5"/><path d="M6 3 V13"/></svg>
      <span class="bn-label">Sessions</span>
    </button>
    <button type="button" class="bn-btn bn-slot" data-act="slot-0" aria-label="Slot L">
      <span class="bn-slot-num">L</span>
      <span class="bn-label bn-slot-label">empty</span>
    </button>
    <button type="button" class="bn-btn bn-slot" data-act="slot-1" aria-label="Slot R">
      <span class="bn-slot-num">R</span>
      <span class="bn-label bn-slot-label">empty</span>
    </button>
    <button type="button" class="bn-btn" data-act="cmds" aria-label="Command history">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4 L6 8 L3 12"/><path d="M8 12 H13"/></svg>
      <span class="bn-label">Cmds</span>
    </button>
    <button type="button" class="bn-btn" data-act="more" aria-label="More">
      <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="4" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="12" cy="8" r="1.4"/></svg>
      <span class="bn-label">More</span>
    </button>
  </nav>

  <!-- mobile-only: reusable bottom sheet. content is filled dynamically by
       openBottomSheet({title, body, actions}). single instance — opening a new
       sheet replaces the current contents. -->
  <div id="bottom-sheet" class="bottom-sheet" aria-hidden="true" hidden>
    <div class="bottom-sheet-backdrop" data-bs-close="1"></div>
    <div class="bottom-sheet-card" role="dialog" aria-modal="true" aria-labelledby="bs-title">
      <div class="bottom-sheet-handle" data-bs-close="1" aria-hidden="true"></div>
      <div class="bottom-sheet-head">
        <span id="bs-title" class="bottom-sheet-title">Sheet</span>
        <button type="button" class="bottom-sheet-close" data-bs-close="1" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 3.5 L12.5 12.5 M12.5 3.5 L3.5 12.5"/></svg>
        </button>
      </div>
      <div id="bs-body" class="bottom-sheet-body"></div>
      <div id="bs-actions" class="bottom-sheet-actions" hidden></div>
    </div>
  </div>
</div>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/vendor/split.min.js"></script>
<script src="/app.js" type="module"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
